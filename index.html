<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Little Test Website</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 15% 15%, #e0eaff 0, transparent 30%),
        radial-gradient(circle at 85% 85%, #f1e7ff 0, transparent 28%),
        #f5f7fb;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid #e8ebf2;
      border-radius: 28px;
      background: rgb(255 255 255 / 90%);
      box-shadow: 0 24px 70px rgb(34 48 78 / 10%);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid #dfe8ff;
      border-radius: 999px;
      background: #f4f7ff;
      color: #405ca8;
      font-size: 0.85rem;
      font-weight: 650;
    }

    .badge::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #55b88a;
      content: "";
    }

    h1 {
      margin: 24px 0 14px;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      letter-spacing: -0.07em;
      line-height: 1.04;
    }

    h1 span {
      color: #607ee8;
    }

    .intro {
      max-width: 490px;
      margin: 0 auto;
      color: #657087;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .demo {
      margin-top: 36px;
      padding: 24px;
      border-radius: 20px;
      background: #f7f8fc;
    }

    .demo p {
      margin: 0 0 16px;
      color: #657087;
    }

    button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #607ee8;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #4c69d1;
    }

    button:focus-visible {
      outline: 3px solid #aebeff;
      outline-offset: 3px;
    }

    #message {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: #405ca8;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Your page is ready</div>
    <h1>A little place<br>to <span>test things.</span></h1>
    <p class="intro">
      A simple starter website made with HTML, CSS, and JavaScript.
      Try the button below to see the JavaScript in action.
    </p>

    <section class="demo" aria-label="Interactive demo">
      <p id="count">You've clicked 0 times.</p>
      <button id="click-button" type="button">Give it a click</button>
      <p id="message" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const button = document.querySelector("#click-button");
    const countLabel = document.querySelector("#count");
    const message = document.querySelector("#message");
    let clicks = 0;

    button.addEventListener("click", () => {
      clicks += 1;
      countLabel.textContent = `You've clicked ${clicks} ${clicks === 1 ? "time" : "times"}.`;
      message.textContent = clicks === 1
        ? "Nice! JavaScript is working."
        : "Still working. Keep going!";
    });
  </script>
</body>
</html>
